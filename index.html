<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>DIY Fueling Calculator v1</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="container">
    <div class="card">
      <h1>DIY Fueling Calculator</h1>

      <!-- Mode Selector -->
      <div class="form-row">
        <label>Mode:</label>
        <select id="mode" onchange="onModeChange()">
          <option value="single">Single</option>
          <option value="shared">Shared</option>
          <option value="race">Race</option>
        </select>
      </div>

      <!-- Single Athlete Mode -->
      <div id="singleMode" class="mode-section">
        <div class="form-row">
          <label for="carbsPerHourSingle">Target carbs/hour (g/hr)</label>
          <select id="carbsPerHourSingle"></select>
        </div>

        <div class="form-row">
          <label for="milesWhole">Distance (miles)</label>
          <select id="milesWhole"></select>
          <span>.</span>
          <select id="milesDecimal"></select>
        </div>

        <div class="form-row">
          <label for="pace">Pace (min/mi)</label>
          <select id="pace"></select>
        </div>
      </div>

      <!-- Race Mode -->
      <div id="raceMode" class="mode-section" style="display:none;">
        <h3>Race Mode</h3>
        <div class="form-row">
          <label for="raceRunner">Runner</label>
          <select id="raceRunner">
            <option value="aaron">Aaron</option>
            <option value="kristin">Kristin</option>
            <option value="custom">Custom</option>
          </select>
        </div>

        <div class="form-row">
          <label for="raceDistanceWhole">Distance (miles)</label>
          <select id="raceDistanceWhole"></select>
          <span>.</span>
          <select id="raceDistanceDecimal"></select>
        </div>

        <div class="form-row">
          <label for="raceFinishTime">Planned finish time (HH:MM)</label>
          <input id="raceFinishTime" type="text" placeholder="3:10" />
        </div>

        <div class="form-row">
          <label for="carbsPerHourRace">Target carbs/hour (g/hr)</label>
          <select id="carbsPerHourRace"></select>
        </div>

        <div class="form-row">
          <label for="aidStations">Aid stations (miles, comma-separated)</label>
          <textarea id="aidStations" rows="3">1.5,2.7,3.9,5.4,7.3,8.9,10.4,11.7,13.1,15,16.5,18,19.6,20.7,22.1,23.6,24.8</textarea>
        </div>

        <div class="form-row">
          <label for="flaskCount">Flasks to carry</label>
          <input id="flaskCount" type="number" min="1" max="6" step="1" value="2" />
        </div>
      </div>

      <!-- Shared Batch Mode -->
      <div id="sharedMode" class="mode-section" style="display:none;">
        <div class="athlete-section">
          <h3>Athlete A (Aaron)</h3>
          <div class="form-row">
            <label>Distance (miles)</label>
            <select id="milesWholeA"></select>
            <span>.</span>
            <select id="milesDecimalA"></select>
          </div>
          <div class="form-row">
            <label>Pace (min/mi)</label>
            <select id="paceA"></select>
          </div>
          <div class="form-row">
            <label>Target carbs/hour (g/hr)</label>
            <select id="carbsPerHourA"></select>
          </div>
          <div class="form-row">
            <button class="preset-btn" onclick="setPresetA(85)">Aaron Preset (85 g/hr)</button>
          </div>
        </div>

        <div class="athlete-section">
          <h3>Athlete B (Kristin)</h3>
          <div class="form-row">
            <label>Distance (miles)</label>
            <select id="milesWholeB"></select>
            <span>.</span>
            <select id="milesDecimalB"></select>
          </div>
          <div class="form-row">
            <label>Pace (min/mi)</label>
            <select id="paceB"></select>
          </div>
          <div class="form-row">
            <label>Target carbs/hour (g/hr)</label>
            <select id="carbsPerHourB"></select>
          </div>
          <div class="form-row">
            <button class="preset-btn" onclick="setPresetB(75)">Kristin Preset (75 g/hr)</button>
          </div>
        </div>
      </div>

      <button class="btn" onclick="calculate()">Calculate</button>

      <!-- Outputs -->
      <div id="out" style="margin-top: 16px;"></div>
    </div>
  </div>

  <!-- Add a version string to force browsers to fetch the latest file -->
  <script src="index.js?v=1.0.2"></script>
</body>
</html>
