<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>DIY Fueling Calculator v1</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="container">
    <div class="card">
      <h1>DIY Fueling Calculator</h1>

      <!-- Mode Selector -->
      <div class="form-row">
        <label>Mode:</label>
        <select id="mode" onchange="onModeChange()">
          <option value="single">Single</option>
          <option value="shared">Shared</option>
          <option value="bulk">Bulk</option>
        </select>
      </div>

      <!-- Single Athlete Mode -->
      <div id="singleMode" class="mode-section">
        <div class="form-row">
          <label for="carbsPerHourSingle">Target carbs/hour (g/hr)</label>
          <select id="carbsPerHourSingle"></select>
        </div>

        <div class="form-row">
          <label for="milesWhole">Distance (miles)</label>
          <select id="milesWhole"></select>
          <span>.</span>
          <select id="milesDecimal"></select>
        </div>

        <div class="form-row">
          <label for="pace">Pace (min/mi)</label>
          <select id="pace"></select>
        </div>
      </div>

      <!-- Bulk Mode -->
      <div id="bulkMode" class="mode-section" style="display:none;">
        <h3>Bulk Mode</h3>
        <div class="form-row">
          <label for="bulkBasis">Start with</label>
          <select id="bulkBasis" onchange="calculate()">
            <option value="malt">Maltodextrin</option>
            <option value="fruc">Fructose</option>
            <option value="carbs">Total Carbs</option>
            <option value="dry">Pre-mixed Dry Ingredients</option>
          </select>
        </div>

        <div class="form-row">
          <label for="bulkAmount">Amount (g)</label>
          <input id="bulkAmount" type="number" min="1" step="1" value="1000" oninput="calculate()" />
        </div>
      </div>

      <!-- Shared Batch Mode -->
      <div id="sharedMode" class="mode-section" style="display:none;">
        <div class="athlete-section">
          <h3>Athlete A</h3>
          <div class="form-row">
            <label>Distance (miles)</label>
            <select id="milesWholeA"></select>
            <span>.</span>
            <select id="milesDecimalA"></select>
          </div>
          <div class="form-row">
            <label>Pace (min/mi)</label>
            <select id="paceA"></select>
          </div>
          <div class="form-row">
            <label>Target carbs/hour (g/hr)</label>
            <select id="carbsPerHourA"></select>
          </div>
          <div class="form-row">
            <button class="preset-btn" onclick="setPresetA(85)">Aaron Preset (85 g/hr)</button>
          </div>
        </div>

        <div class="athlete-section">
          <h3>Athlete B</h3>
          <div class="form-row">
            <label>Distance (miles)</label>
            <select id="milesWholeB"></select>
            <span>.</span>
            <select id="milesDecimalB"></select>
          </div>
          <div class="form-row">
            <label>Pace (min/mi)</label>
            <select id="paceB"></select>
          </div>
          <div class="form-row">
            <label>Target carbs/hour (g/hr)</label>
            <select id="carbsPerHourB"></select>
          </div>
          <div class="form-row">
            <button class="preset-btn" onclick="setPresetB(75)">Kristin Preset (75 g/hr)</button>
          </div>
        </div>
      </div>

      <button class="btn" onclick="calculate()">Calculate</button>

      <!-- Outputs -->
      <div id="out" style="margin-top: 16px;"></div>
    </div>
  </div>

  <!-- Add a version string to force browsers to fetch the latest file -->
  <script src="index.js?v=1.0.3"></script>
</body>
</html>
